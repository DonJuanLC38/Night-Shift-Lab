<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E2A25">
<meta name="description" content="Gélosatro : le roguelite du technicien de laboratoire. Identifie les bactéries, débloque géloses et tests.">
<title>NIGHT SHIFT LAB · Le roguelite du labo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script>
/* Remise à zéro : ?reset dans l'adresse efface la progression avant le démarrage */
window.gelosatroReset=function(){ window.__resetting=true; try{ localStorage.removeItem('gelosatro_meta'); localStorage.removeItem('gelosatro_run'); }catch(_){}
  try{ location.replace(location.pathname+'?fresh='+Date.now()); }catch(_){ location.reload(); } };
try{ if(/[?&]fresh=/.test(location.search)) history.replaceState(null,'',location.pathname); }catch(_){}
try{ if(/[?&]reset\b/.test(location.search)){ localStorage.removeItem('gelosatro_meta'); localStorage.removeItem('gelosatro_run'); history.replaceState(null,'',location.pathname); } }catch(_){}
/* Filet de sécurité au démarrage : affiche la vraie erreur à l'écran + bouton pour repartir de zéro */
window.__bootErr=[];
window.addEventListener('error',function(e){ try{ if(!e.lineno&&!e.filename&&/^Script error\.?$/i.test(e.message||'')){ console.warn('Erreur externe ignorée (extension du navigateur)'); return; } if(e.filename&&e.filename.indexOf(location.origin)!==0&&location.protocol!=='file:'){ console.warn('Erreur externe ignorée : '+e.filename); return; } var m=(e.message||'erreur')+' (ligne '+(e.lineno||'?')+':'+(e.colno||'?')+')'; window.__bootErr.push(m);
  var d=document.getElementById('bootErr'); if(!d){ d=document.createElement('div'); d.id='bootErr';
  d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#B9342C;color:#fff;font:13px/1.35 monospace;padding:10px 12px;border-radius:8px;white-space:pre-wrap;box-shadow:0 4px 0 #6A1A14';
  (document.body||document.documentElement).appendChild(d); }
  d.innerHTML=''; var t=document.createElement('div'); t.textContent='⚠️ Erreur NIGHT SHIFT LAB — fais une capture et envoie-la :\n'+window.__bootErr.slice(-3).join('\n')+'\n'+navigator.userAgent.slice(0,120); d.appendChild(t);
  var b=document.createElement('button'); b.textContent='🔄 Repartir de zéro (efface la progression)'; b.style.cssText='margin-top:8px;width:100%;padding:10px;border:0;border-radius:7px;background:#fff;color:#B9342C;font:bold 14px sans-serif';
  b.onclick=function(){ if(confirm('Effacer toute ta progression et relancer le jeu ?')) window.gelosatroReset(); }; d.appendChild(b);
  var k=document.createElement('button'); k.textContent='✕ Fermer et continuer'; k.style.cssText='margin-top:6px;width:100%;padding:8px;border:0;border-radius:7px;background:rgba(255,255,255,.18);color:#fff;font:bold 13px sans-serif'; k.onclick=function(){ d.remove(); }; d.appendChild(k); }catch(_){} });
</script>
<style>
:root{
  --chips:#1E9BFF; --chips-d:#0B6BB8; --mult:#FE5F55; --mult-d:#B9342C;
  --gold:#F5B143; --gold-d:#B97A12; --orange:#FDA200; --orange-d:#B86F00;
  --green:#4BC292; --green-d:#2A8A63; --purple:#9B6BE0; --purple-d:#6A41A8;
  --panel:#2E4448; --panel2:#3A5459; --panel-d:#1B2A2D; --edge:#5F7F84;
  --cream:#F4EEDF; --cream-d:#D9CFB6; --ink:#2A2421;
  --txt:#FFFFFF; --soft:#C9D6D6;
  --font:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0E2A25;color:var(--txt);overflow:hidden}
body{font-family:var(--font);font-size:15px;line-height:1.25;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;text-shadow:0 2px 0 rgba(0,0,0,.45)}
button{font-family:var(--font);color:inherit;text-shadow:inherit}

/* Fond tourbillon façon Balatro */
#bg{position:fixed;inset:-30%;z-index:0;background:
  conic-gradient(from 0deg at 50% 50%,#0F3B33,#145446,#0E2A25,#5A1E2A,#0F3B33,#1B6151,#0E2A25,#0F3B33);
  filter:blur(36px) saturate(1.1);animation:swirl 38s linear infinite;opacity:.95}
#bg2{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 50% 40%,transparent 30%,rgba(0,0,0,.55) 100%)}
#scan{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
@keyframes swirl{to{transform:rotate(360deg)}}

#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 10px 12px}

/* Panneaux / boutons */
.panel{background:var(--panel);border-radius:10px;box-shadow:0 4px 0 var(--panel-d), inset 0 0 0 2px rgba(255,255,255,.04)}
.inset{background:var(--panel-d);border-radius:8px}
.btn{border:0;border-radius:9px;padding:12px 14px;font-size:17px;font-weight:600;cursor:pointer;letter-spacing:.02em;transition:transform .06s}
.btn:active{transform:translateY(3px)}
.btn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.b-blue{background:var(--chips);box-shadow:0 4px 0 var(--chips-d)}
.b-red{background:var(--mult);box-shadow:0 4px 0 var(--mult-d)}
.b-orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.b-green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.b-gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#3A2400;text-shadow:none}
.b-gray{background:var(--panel2);box-shadow:0 4px 0 var(--panel-d)}
.b-purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.btn:active{box-shadow:0 1px 0 rgba(0,0,0,.4)}
.icon-btn{border:0;background:var(--panel2);box-shadow:0 3px 0 var(--panel-d);border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer}

/* Titre */
.title-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.logo{font-size:52px;font-weight:700;letter-spacing:.02em;line-height:1;color:#fff;text-shadow:0 4px 0 var(--mult-d),0 8px 0 rgba(0,0,0,.35);animation:wob 3s ease-in-out infinite}
.logo span{display:inline-block;animation:bounce 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tagline{font-size:15px;color:var(--soft)}
.menu{display:flex;flex-direction:column;gap:12px;width:min(300px,86%);margin-top:10px}
.lvlbar{width:min(300px,86%);margin-top:8px}
.bar{height:14px;border-radius:7px;background:var(--panel-d);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--chips),#6CC6FF);transition:width .8s ease}
.lvltxt{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-bottom:4px}
.title-cards{display:flex;gap:6px;margin-bottom:8px}
.title-cards .card{animation:float 3s ease-in-out infinite}
.title-cards .card:nth-child(2){animation-delay:.4s;transform:rotate(4deg)} .title-cards .card:nth-child(1){transform:rotate(-6deg)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}

/* HUD */
.hud{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-bottom:8px}
.blind{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.blind .bname{font-size:14px;color:var(--soft)}
.blind .bt{font-size:12px;color:var(--soft)}
.blind .target{font-size:24px;font-weight:700;color:var(--mult);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.boss{color:var(--gold)!important}
.scorebox{padding:8px 10px;display:flex;flex-direction:column;justify-content:center}
.scorebox .lab{font-size:12px;color:var(--soft)}
.scorebox .val{font-size:26px;font-weight:700}
.stats{display:flex;gap:6px;margin-bottom:8px}
.stat{flex:1;padding:6px 4px;text-align:center}
.stat .v{font-size:19px;font-weight:700}
.stat .l{font-size:11px;color:var(--soft)}
.v.time{color:var(--chips)} .v.disc{color:var(--mult)} .v.gold{color:var(--gold)} .v.life{color:#FF8FA3}

.jokers{display:flex;gap:6px;margin-bottom:8px;min-height:62px}
.jk{width:52px;height:62px;border-radius:7px;background:var(--panel-d);border:2px dashed rgba(255,255,255,.12);flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;border-style:dashed}
.jk.on{border:0;background:linear-gradient(160deg,#FFF6D8,#F1D98F);box-shadow:0 3px 0 #9C7B2E;font-size:28px;text-shadow:none}
.jk.on.rare{background:linear-gradient(160deg,#F6E3FF,#C9A4F2);box-shadow:0 3px 0 #6A41A8}
.jk.shake{animation:shake .45s ease}
.jk .pop{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:12px;padding:1px 5px;border-radius:5px;white-space:nowrap;background:var(--mult);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.1)}75%{transform:rotate(10deg) scale(1.1)}}

/* Cas patient + paillasse */
.case{padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.case .ico{font-size:30px}
.case .t{font-size:13px;color:var(--soft)}
.case .d{font-size:15px}
.bossbar{font-size:13px;color:var(--gold);margin-top:3px}
.bench{flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.bench-empty{margin:auto;text-align:center;color:var(--soft);font-size:14px;padding:10px}
.res{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:7px 9px;animation:pop .3s ease}
.res svg{width:54px;height:54px;flex-shrink:0}
.res .rt{font-size:13px;color:var(--soft)}
.res .rd{font-size:14.5px}
.res .warn{font-size:12px;color:var(--gold)}
.res.bad{box-shadow:inset 3px 0 0 var(--mult)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

/* Actions + main */
.selinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;font-size:13.5px;color:var(--soft);margin:8px 2px 4px}
.selinfo b{color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.actions .btn{padding:11px 4px;font-size:15px}
.hand{display:flex;justify-content:center;align-items:flex-start;padding:20px 0 4px;margin-top:2px}
.hand .card{transition:transform .15s ease}
.hand .card.sel{transform:translateY(-18px) rotate(0deg)!important}

/* Cartes */
.card{position:relative;width:74px;height:110px;flex-shrink:0;border-radius:8px;background:var(--cream);color:var(--ink);text-shadow:none;box-shadow:0 4px 0 var(--cream-d),0 6px 12px rgba(0,0,0,.35);cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.card .band{height:20px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.03em;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.card .art{flex:1;display:flex;align-items:center;justify-content:center;padding:2px}
.card .art svg{width:46px;height:46px}
.card .nm{font-size:10.5px;font-weight:600;text-align:center;line-height:1.05;padding:0 3px 3px;min-height:23px;display:flex;align-items:center;justify-content:center}
.card .cost{position:absolute;top:22px;left:3px;font-size:11px;font-weight:700;background:var(--chips);color:#fff;border-radius:5px;padding:0 4px;text-shadow:none}
.card .cost.free{background:var(--green)}
.card .chp{position:absolute;top:22px;right:3px;font-size:10px;font-weight:700;color:var(--chips-d)}
.card.na{filter:grayscale(.9) brightness(.7)}
.card.na::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;color:rgba(185,52,44,.75)}
.t-exam .band{background:#6C7A89} .t-micro .band{background:#3D7FD6} .t-milieu .band{background:#2E9E6E} .t-test .band{background:#E0823A} .t-ident .band{background:#8A55C9} .t-clin .band{background:#B0476B} .t-spe .band{background:#222}
.ed-foil{background:linear-gradient(115deg,#F4EEDF 20%,#CFE6FF 40%,#F4EEDF 60%,#D8F2FF 80%);background-size:250% 100%;animation:shine 3s linear infinite}
.ed-holo{background:linear-gradient(160deg,#FFE4E1,#F4EEDF 50%,#FFD5D0)}
.ed-poly{animation:hue 4s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.edtag{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5)}

/* Feuilles / modales */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(5,15,14,.72)}
#modal.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:90%;overflow-y:auto;background:var(--panel);border-radius:14px 14px 0 0;box-shadow:0 -4px 0 var(--panel-d);padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:22px}
.sheet h3{margin:14px 0 6px;font-size:16px;color:var(--gold)}
.sheet p,.sheet li{font-size:14.5px;color:var(--soft);margin:0}
.sheet ol,.sheet ul{margin:0;padding-left:20px}
.sheet li{margin:3px 0}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pk{display:flex;align-items:center;gap:8px;text-align:left;background:var(--panel2);border:0;border-radius:9px;padding:8px;box-shadow:0 3px 0 var(--panel-d);cursor:pointer;font-size:13.5px;font-style:italic}
.pk svg{width:36px;height:36px;flex-shrink:0}
.pk.on{outline:3px solid var(--gold)}
.cat{display:flex;flex-direction:column;gap:8px}
.illus{background:var(--panel-d);border-radius:9px;padding:10px;margin:8px 0;display:flex;justify-content:center}
.illus svg{max-width:100%;height:auto;max-height:150px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.kv b{color:#fff}
.kv span{color:var(--soft)}

/* Calcul du score */
.calc{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0}
.calc .c,.calc .m{min-width:100px;text-align:center;font-size:30px;font-weight:700;padding:8px 10px;border-radius:9px}
.calc .c{background:var(--chips);box-shadow:0 4px 0 var(--chips-d)}
.calc .m{background:var(--mult);box-shadow:0 4px 0 var(--mult-d)}
.calc .x{font-size:28px;color:var(--mult)}
.calc .bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.18)}}
.total{text-align:center;font-size:40px;font-weight:700;margin:4px 0}
.total.fire{color:var(--gold);animation:bump .4s ease 3}
.steps{display:flex;flex-direction:column;gap:5px;margin-top:8px;max-height:220px;overflow-y:auto}
.step{display:flex;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:7px;padding:6px 9px;font-size:13.5px;opacity:0;transform:translateX(-8px);transition:all .2s}
.step.in{opacity:1;transform:none}
.step .pc{color:var(--chips);font-weight:700} .step .pm{color:var(--mult);font-weight:700} .step .px{color:var(--gold);font-weight:700}
.verdict{text-align:center;font-size:24px;font-weight:700;margin:8px 0}
.good{color:var(--green)} .badc{color:var(--mult)}
.fiche{background:var(--panel-d);border-radius:9px;padding:10px;margin-top:10px}
.fiche .fn{font-size:19px;font-style:italic;font-weight:700}
.trs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.tr{font-size:12.5px;background:var(--panel2);border-radius:6px;padding:3px 7px}
.alert{margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(254,95,85,.18);color:#FFB3AD;font-size:13.5px}
.path{display:flex;flex-wrap:wrap;gap:5px}
.pth{font-size:12.5px;border-radius:6px;padding:3px 7px;background:var(--panel2)}
.pth.ok{background:rgba(75,194,146,.25);color:#9CF0CB} .pth.no{background:rgba(255,255,255,.06);color:var(--soft)} .pth.il{background:rgba(254,95,85,.22);color:#FFB3AD} .pth.miss{background:transparent;border:1px dashed var(--edge);color:var(--soft)}

/* Boutique */
.shop-h{text-align:center;font-size:30px;font-weight:700;color:var(--gold);margin:4px 0 2px}
.shelf{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px}
.item .price{font-size:15px;font-weight:700;color:var(--gold)}
.item .btn{padding:7px 10px;font-size:14px;width:100%}
.jbig{width:74px;height:110px;border-radius:8px;background:linear-gradient(160deg,#FFF6D8,#F1D98F);box-shadow:0 4px 0 #9C7B2E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:none;color:var(--ink);cursor:pointer;font-size:34px}
.jbig.rare{background:linear-gradient(160deg,#F6E3FF,#C9A4F2);box-shadow:0 4px 0 #6A41A8}
.jbig small{font-size:10px;font-weight:700;text-align:center;line-height:1.05;padding:0 4px}
.sold{opacity:.25;pointer-events:none}

/* Divers */
.row{display:flex;gap:8px}
.grow{flex:1}
.center{text-align:center}
.muted{color:var(--soft)}
.gold{color:var(--gold)}
.big{font-size:22px;font-weight:700}
.scroll{flex:1;overflow-y:auto;min-height:0}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs .btn{flex:1;padding:9px 4px;font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--panel2);border-radius:9px;padding:8px;text-align:center;font-size:12px;cursor:pointer;box-shadow:0 3px 0 var(--panel-d);border:0}
.cell svg{width:50px;height:50px}
.cell.lock{opacity:.45}
.cell .n{font-style:italic;margin-top:3px;line-height:1.1}
.troph{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:9px;padding:9px;margin-bottom:7px}
.troph .ti{font-size:30px}
.troph.lock{opacity:.45;filter:grayscale(1)}
.troph .tn{font-size:15px}
.troph .td{font-size:12.5px;color:var(--soft)}
.unl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13.5px}
.unl .lv{min-width:44px;font-weight:700;color:var(--chips)}
.unl.got .lv{color:var(--green)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(calc(-100% - 40px));z-index:60;background:var(--gold);color:#3A2400;text-shadow:none;padding:10px 16px;border-radius:10px;box-shadow:0 4px 0 var(--gold-d);font-weight:700;font-size:15px;transition:transform .3s ease;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.topbar h2{margin:0;font-size:24px}
#poster{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(80,0,0,.55);animation:flash .5s ease}
.pst{width:min(400px,100%);max-height:94%;overflow-y:auto;text-align:center;padding:12px 16px 16px;border-radius:12px;background:#FFE14D;color:#1A1200;text-shadow:none;
  border:8px solid transparent;border-image:repeating-linear-gradient(45deg,#111 0 14px,#FFD000 14px 28px) 12;box-shadow:0 0 0 4px #111,0 12px 40px rgba(0,0,0,.6);
  animation:scream .55s cubic-bezier(.2,1.6,.4,1)}
.pst-top{font-size:13px;letter-spacing:.2em;color:#B00}
.pst-face{font-size:64px;line-height:1;margin:4px 0;animation:shk .12s linear 6}
.pst-h{font-size:36px;font-weight:700;line-height:1;color:#D10000;text-shadow:3px 3px 0 #111;letter-spacing:.02em;margin:4px 0 8px;transform:rotate(-3deg)}
.pst-card{font-size:17px}

.logo2{display:flex!important;flex-direction:column;align-items:center;line-height:.95!important;white-space:nowrap;font-size:clamp(46px,16vw,84px)!important}.logo2 .lw{display:block}
.gitem.on{box-shadow:0 0 0 3px #4BC292,0 0 20px rgba(75,194,146,.4)}.gitem.off{opacity:.4}.gi-t{color:#9fdcff!important}.gi-c{font-size:14px}.gi-c span{font-family:var(--num);font-size:20px;color:var(--soft)}.gi-c b{font-family:var(--num);font-size:24px;font-weight:400;color:#4BC292}

/* ===== v11 · paillasse en tuiles ===== */

<body>
<div id="bg"></div><div id="bg2"></div>
<div id="app"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="scan"></div>
<script>
function rng(seed){ let s = seed % 2147483647; if (s<=0) s += 2147483646; return ()=> (s = s*16807 % 2147483647) / 2147483647; }
const VIO='#6B3FB8', PINK='#E0659C', FIELD='#F2ECE2';

/* Vue microscope */
function micro(type, seed=7){
  const r = rng(seed); let g='';
  const coc=(x,y,rr,c)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr}" fill="${c}"/>`;
  const rod=(x,y,l,w,a,c)=>`<rect x="${(x-l/2).toFixed(1)}" y="${(y-w/2).toFixed(1)}" width="${l}" height="${w}" rx="${w/2}" fill="${c}" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  let bg = FIELD;
  if (type==='amas'){ for(let k=0;k<4;k++){ const cx=22+r()*56, cy=22+r()*56; for(let i=0;i<9;i++) g+=coc(cx+(r()-.5)*16,cy+(r()-.5)*16,3.4,VIO);} }
  else if (type==='chain'){ for(let k=0;k<4;k++){ let x=12+r()*30, y=15+k*20+r()*6, a=(r()-.5)*.6; for(let i=0;i<8;i++){ g+=coc(x,y,3.2,VIO); x+=6.6*Math.cos(a); y+=6.6*Math.sin(a); a+=(r()-.5)*.4; } } }
  else if (type==='diplo'){ for(let k=0;k<8;k++){ const x=18+r()*64,y=18+r()*64,a=r()*180; g+=`<g transform="rotate(${a} ${x} ${y})"><ellipse cx="${x-3.6}" cy="${y}" rx="3.6" ry="2.6" fill="${VIO}"/><ellipse cx="${x+3.6}" cy="${y}" rx="3.6" ry="2.6" fill="${VIO}"/><ellipse cx="${x}" cy="${y}" rx="10" ry="6" fill="none" stroke="${VIO}" stroke-opacity=".25" stroke-dasharray="2 2"/></g>`; } }
  else if (type==='bgn'){ for(let k=0;k<14;k++) g+=rod(14+r()*72,14+r()*72,11,4.6,r()*180,PINK); }
  else if (type==='bgnfat'){ for(let k=0;k<10;k++){ const x=16+r()*68,y=16+r()*68,a=r()*180; g+=`<rect x="${x-9}" y="${y-5}" width="18" height="10" rx="5" fill="#fff" stroke="${PINK}" stroke-opacity=".5" transform="rotate(${a} ${x} ${y})"/>`+rod(x,y,11,5,a,PINK);} }
  else if (type==='curve'){ for(let k=0;k<10;k++){ const x=16+r()*64,y=16+r()*64,a=r()*180; g+=`<path d="M${x} ${y} q4 -6 8 0 q4 6 8 0" stroke="${PINK}" stroke-width="3.6" fill="none" stroke-linecap="round" transform="rotate(${a} ${x+8} ${y})"/>`; } }
  else if (type==='cocco'){ for(let k=0;k<24;k++) g+=rod(12+r()*76,12+r()*76,5.5,3.4,r()*180,PINK); }
  else if (type==='cgn'){ g+=`<circle cx="50" cy="50" r="24" fill="#D9C6E8"/><path d="M40 46 q6-10 12 0 q6 10 10 0" stroke="#7A4AA8" stroke-width="7" fill="none" stroke-linecap="round"/>`; for(let k=0;k<6;k++){const x=36+r()*28,y=40+r()*22,a=r()*180; g+=`<g transform="rotate(${a} ${x} ${y})"><path d="M${x-6} ${y} a3.2 3.6 0 1 1 5 0 z" fill="${PINK}"/><path d="M${x+6} ${y} a3.2 3.6 0 1 0 -5 0 z" fill="${PINK}"/></g>`;} for(let k=0;k<3;k++){const x=12+r()*76,y=k<2?14+r()*10:80+r()*8; g+=coc(x-2.6,y,2.6,PINK)+coc(x+2.6,y,2.6,PINK);} }
  else if (type==='bgp'){ for(let k=0;k<5;k++){ const x=18+r()*60,y=18+r()*60,a=r()*180; for(let i=0;i<3;i++) g+=rod(x+i*4.5*Math.sin(a*Math.PI/180),y-i*4.5*Math.cos(a*Math.PI/180),12,3.6,a,VIO); g+=rod(x+10,y+8,11,3.6,a+50,VIO);} }
  else if (type==='bgpshort'){ for(let k=0;k<16;k++) g+=rod(12+r()*76,12+r()*76,7,3.6,r()*180,VIO); }
  else if (type==='levure'){ for(let k=0;k<7;k++){const x=18+r()*62,y=18+r()*62,a=r()*180; g+=`<g transform="rotate(${a} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="6" ry="4.4" fill="${VIO}"/><ellipse cx="${x+7.5}" cy="${y}" rx="2.8" ry="2.2" fill="${VIO}"/></g>`;} g+=`<path d="M10 80 q20 -6 40 2 t40 -4" stroke="${VIO}" stroke-width="3.4" fill="none" stroke-dasharray="7 2"/>`; }
  else if (type==='baar'){ bg='#CFE3F2'; for(let k=0;k<12;k++){const x=16+r()*68,y=16+r()*68,a=r()*180; g+=`<path d="M${x-5} ${y} q5 -2 10 0" stroke="#D2264B" stroke-width="2.2" fill="none" stroke-linecap="round" transform="rotate(${a} ${x} ${y})"/>`;} }
  else if (type==='pnn'){ for(let k=0;k<9;k++){const x=16+r()*68,y=16+r()*68; g+=`<circle cx="${x}" cy="${y}" r="8" fill="#E7D6EF"/><path d="M${x-4} ${y-1} q2-4 4 0 q2 4 4 0" stroke="#7A4AA8" stroke-width="3" fill="none" stroke-linecap="round"/>`;} }
  else if (type==='epi'){ for(let k=0;k<4;k++){const x=22+r()*56,y=22+r()*56; g+=`<path d="M${x-14} ${y-6} l10 -10 l16 2 l4 14 l-10 12 l-16 -2 z" fill="#F7E3D1" stroke="#C99A78"/><circle cx="${x}" cy="${y}" r="3" fill="#8A5E9E"/>`;} }
  else if (type==='mix'){ return micro('bgn',seed); }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="c${type}${seed}"><circle cx="50" cy="50" r="46"/></clipPath></defs><circle cx="50" cy="50" r="48" fill="#2A2A2A"/><circle cx="50" cy="50" r="46" fill="${bg}"/><g clip-path="url(#c${type}${seed})">${g}</g></svg>`;
}

/* Boîte de Pétri */
function dish(o={}, seed=3){
  const r = rng(seed); const agar=o.agar||'#E8D9B5', col=o.col||'#F4F0E6', rad=o.rad||2.6;
  let halos='', cols='', extra='';
  const zones=[[14,48,14,48,o.n1||22],[52,86,14,48,o.n2||12],[52,86,52,86,o.n3||7],[14,48,52,86,o.n4||4]];
  zones.forEach(([x1,x2,y1,y2,n])=>{ for(let i=0;i<n;i++){ const x=x1+r()*(x2-x1), y=y1+r()*(y2-y1); if(Math.hypot(x-50,y-50)>40) continue;
    const c = Array.isArray(col) ? col[i%col.length] : col; const rr = rad*(.75+r()*.5);
    if (o.halo) halos+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rr+o.haloR).toFixed(1)}" fill="${o.halo}"/>`;
    cols+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}" fill="${c}" ${o.stroke?`stroke="${o.stroke}" stroke-width="1"`:''}/>`;
    if (o.dot) cols+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rr*.45).toFixed(1)}" fill="${o.dot}"/>`; } });
  if (o.voile) for(let i=1;i<5;i++) extra+=`<circle cx="44" cy="46" r="${i*9}" fill="none" stroke="#F5F2EA" stroke-opacity=".45" stroke-width="5"/>`;
  if (o.empty){ cols=''; halos=''; }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#BFC4C9" opacity=".55"/><circle cx="50" cy="50" r="44" fill="${agar}"/>${extra}${halos}${cols}<circle cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/><path d="M22 20 a40 40 0 0 1 30 -12" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
}

/* Tubes */
function tubeG(x, t){
  const w=22, top=10, h=78; let fill='';
  const id='t'+Math.round(x*7)+(t.lab||'').length;
  const clip=`<clipPath id="${id}"><path d="M${x} ${top} v${h-10} a${w/2} ${w/2} 0 0 0 ${w} 0 v-${h-10} z"/></clipPath>`;
  if (t.slant){ fill+=`<rect x="${x}" y="${top+14}" width="${w}" height="${h}" fill="${t.culot}"/><path d="M${x} ${top+14} L${x+w} ${top+34} L${x+w} ${top+14} z" fill="${t.slant}"/><path d="M${x} ${top+14} L${x+w} ${top+34} L${x+w} ${top+46} L${x} ${top+40} z" fill="${t.slant}"/>`; }
  else fill+=`<rect x="${x}" y="${top+(t.lvl||16)}" width="${w}" height="${h}" fill="${t.c||'#E9DFC0'}"/>`;
  if (t.ring) fill+=`<rect x="${x}" y="${top+(t.lvl||16)}" width="${w}" height="7" fill="${t.ring}"/>`;
  if (t.black) fill+=`<ellipse cx="${x+w/2}" cy="${top+h-6}" rx="${w/2}" ry="11" fill="#2B2321"/>`;
  if (t.stab==='line') fill+=`<rect x="${x+w/2-1.2}" y="${top+20}" width="2.4" height="${h-26}" fill="#8A7458" opacity=".8"/>`;
  if (t.stab==='diffuse') fill+=`<rect x="${x+2}" y="${top+22}" width="${w-4}" height="${h-26}" fill="#fff" opacity=".35"/>`;
  if (t.clot) fill+=`<path d="M${x+3} ${top+50} q8 -10 16 0 v${h-46} h-16 z" fill="#B23A3A" opacity=".85"/>`;
  if (t.umbrella) fill+=`<path d="M${x+3} ${top+30} q8 -8 16 0 q-8 4 -16 0 z" fill="#fff" opacity=".7"/><rect x="${x+w/2-1}" y="${top+26}" width="2" height="${h-34}" fill="#fff" opacity=".5"/>`;
  if (t.trouble) fill+=`<rect x="${x}" y="${top+16}" width="${w}" height="${h}" fill="#fff" opacity=".35"/>`;
  let bubbles='';
  if (t.gas) bubbles=`<g class="anim-bub"><circle cx="${x+7}" cy="${top+h-12}" r="2" fill="none" stroke="#fff"/><circle cx="${x+14}" cy="${top+h-20}" r="1.6" fill="none" stroke="#fff"/></g>`;
  return `${clip}<g clip-path="url(#${id})">${fill}${bubbles}</g><path d="M${x} ${top} v${h-10} a${w/2} ${w/2} 0 0 0 ${w} 0 v-${h-10}" fill="none" stroke="#C9CED3" stroke-width="2"/><rect x="${x-2}" y="${top-6}" width="${w+4}" height="8" rx="2" fill="${t.cap||'#5B8DC9'}"/>${t.lab?`<text x="${x+w/2}" y="${top+h+20}" font-size="9" fill="currentColor" text-anchor="middle">${t.lab}</text>`:''}`;
}
function tubes(list){ const W = list.length*36+8; return `<svg viewBox="0 0 ${W} 122" style="color:var(--soft)" aria-hidden="true">${list.map((t,i)=>tubeG(10+i*36,t)).join('')}</svg>`; }
/* petits schémas de résultats */
const R = {
  ox:(p)=>`<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="#F1EEE4" stroke="#C9CED3" stroke-width="2"/><circle cx="30" cy="30" r="12" fill="${p?'#6A3BB5':'#F7F4EA'}" stroke="#ddd"/></svg>`,
  cat:(p)=>`<svg viewBox="0 0 60 60"><rect x="4" y="30" width="52" height="14" rx="2" fill="#DDE6EC"/><ellipse cx="30" cy="34" rx="14" ry="5" fill="#CFE6F5"/>${p?'<circle cx="24" cy="26" r="3" fill="none" stroke="#7FB6E0" stroke-width="1.5"/><circle cx="33" cy="22" r="2.5" fill="none" stroke="#7FB6E0" stroke-width="1.5"/><circle cx="29" cy="14" r="2" fill="none" stroke="#7FB6E0" stroke-width="1.5"/><circle cx="37" cy="29" r="2" fill="none" stroke="#7FB6E0" stroke-width="1.5"/>':''}</svg>`,
  agg:(p)=>`<svg viewBox="0 0 60 60"><rect x="4" y="10" width="52" height="40" rx="6" fill="#F1EEE4"/><circle cx="30" cy="30" r="15" fill="#DCE9F5"/>${p?[...Array(10)].map((_,i)=>`<circle cx="${20+(i*7)%21}" cy="${23+Math.floor(i/3)*6}" r="2.6" fill="#5577AA"/>`).join(''):'<circle cx="30" cy="30" r="12" fill="#8FA9CF" opacity=".5"/>'}</svg>`,

/* vues microscopiques du sang */
const _microBase = micro;
micro = function(type, seed=7){
  const H={rbc:1,microh:1,macroc:1,schizo:1,drep:1,blast:1,palu:1,aggr:1,retic:1,bio:1};
  if(!H[type]) return _microBase(type,seed);
  const r=rng(seed); let g=''; const rb=(x,y,rr,pale,c='#E7A0A6')=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr}" fill="${c}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rr*pale).toFixed(1)}" fill="#F7E3E4"/>`;
  if(type==='bio') return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#2A2A2A"/><circle cx="50" cy="50" r="46" fill="#22343A"/><rect x="38" y="16" width="24" height="66" rx="11" fill="#E9F1F6"/><rect x="40" y="46" width="20" height="34" rx="9" fill="#F2D16B"/><rect x="40" y="62" width="20" height="18" rx="8" fill="#B23A3A"/><rect x="35" y="11" width="30" height="10" rx="3" fill="#2E9E6E"/></svg>`;
  const N=type==='blast'?5:18;
  for(let k=0;k<N;k++){ const x=14+r()*72, y=14+r()*72;
    if(type==='rbc'||type==='retic'||type==='palu'||type==='aggr') g+=rb(x,y,6.5,.35);
    if(type==='microh') g+=rb(x,y,4.4,.62,'#EBB7BB');
    if(type==='macroc') g+=rb(x,y,8.5,.25,'#E08A92');
    if(type==='schizo') g+= k%3? rb(x,y,6.5,.35) : `<path d="M${x-5} ${y} q5 -7 10 0 l-3 2 q-2 -3 -4 0 z" fill="#E08A92"/>`;
    if(type==='drep') g+= k%2? rb(x,y,6.5,.35) : `<path d="M${x-7} ${y} q7 -9 14 0 q-7 -4 -14 0 z" fill="#D46F7A"/>`;
    if(type==='blast'){ g+=`<circle cx="${x}" cy="${y}" r="13" fill="#B9C8EA"/><circle cx="${x}" cy="${y}" r="10" fill="#5B4FA8"/><circle cx="${x+3}" cy="${y-2}" r="2" fill="#8E86D0"/>`; }
  }
  if(type==='retic') for(let k=0;k<5;k++){ const x=20+r()*60,y=20+r()*60; g+=rb(x,y,6.5,.2,'#A9C3E8')+[0,1,2].map(i=>`<circle cx="${x-2+i*2}" cy="${y-1+(i%2)*2}" r=".9" fill="#2E4FA0"/>`).join(''); }
  if(type==='palu') for(let k=0;k<4;k++){ const x=20+r()*60,y=20+r()*60; g+=rb(x,y,6.5,.2)+`<circle cx="${x}" cy="${y}" r="3" fill="none" stroke="#5B2E9E" stroke-width="1.1"/><circle cx="${x+2.4}" cy="${y-1.6}" r="1.1" fill="#C2264B"/>`; }
  if(type==='aggr') for(let k=0;k<3;k++){ const x=20+r()*60,y=20+r()*60; for(let i=0;i<7;i++) g+=`<circle cx="${x+(r()-.5)*9}" cy="${y+(r()-.5)*9}" r="1.8" fill="#7A4AA8"/>`; }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="h${type}${seed}"><circle cx="50" cy="50" r="46"/></clipPath></defs><circle cx="50" cy="50" r="48" fill="#2A2A2A"/><circle cx="50" cy="50" r="46" fill="#F6EEF0"/><g clip-path="url(#h${type}${seed})">${g}</g></svg>`;
};

const _micro2 = micro;
micro = function(type, seed=7){
  const T={eos:1,lymph:1,pnnb:1};
  if(!T[type]) return _micro2(type,seed);
  const r=rng(seed); let g='';
  for(let k=0;k<14;k++){ const x=14+r()*72,y=14+r()*72; g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="#E7A0A6"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="#F7E3E4"/>`; }
  for(let k=0;k<3;k++){ const x=24+r()*52,y=24+r()*52;
    if(type==='eos') g+=`<circle cx="${x}" cy="${y}" r="12" fill="#F4C9A0"/>${[...Array(14)].map(()=>`<circle cx="${x+(r()-.5)*18}" cy="${y+(r()-.5)*18}" r="1.4" fill="#E0823A"/>`).join('')}<ellipse cx="${x-4}" cy="${y}" rx="4" ry="5" fill="#6B3FB8"/><ellipse cx="${x+4}" cy="${y}" rx="4" ry="5" fill="#6B3FB8"/>`;
    if(type==='lymph') g+=`<circle cx="${x}" cy="${y}" r="13" fill="#5B7FD0"/><circle cx="${x-2}" cy="${y}" r="8" fill="#3B2E8E"/>`;
    if(type==='pnnb') g+=`<circle cx="${x}" cy="${y}" r="11" fill="#EAD6EE"/><path d="M${x-6} ${y} q3-6 6 0 q3 6 6 0" stroke="#6B3FB8" stroke-width="3.5" fill="none" stroke-linecap="round"/>`; }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="w${type}${seed}"><circle cx="50" cy="50" r="46"/></clipPath></defs><circle cx="50" cy="50" r="48" fill="#2A2A2A"/><circle cx="50" cy="50" r="46" fill="#F6EEF0"/><g clip-path="url(#w${type}${seed})">${g}</g></svg>`;
};

function SVdisc(s){ return `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="27" fill="#D8C79F"/>${s?'<circle cx="30" cy="30" r="15" fill="#E9DEC2"/>':''}<circle cx="30" cy="30" r="5" fill="#fff" stroke="#999"/></svg>`; }
let busy=false;
async function playCard(id){
  if(busy) return;
  const rs=run.cur; const c={id,ed:(run.ed||{})[id]||''}; const u=id; const [ok,why]=canPlay(c); if(!ok){toast(why);return;}
  const C=CARDS[c.id], b=BACT[rs.bid];
  const ill=!prereqOk(C,rs.flags), fl={...rs.flags}, rep=rs.played.some(p=>p.id===c.id);
  const r=result(c.id,b,rs);
  busy=true; try{ await playAnim(c.id, r, u, ill, rep); }catch(e){ console.error(e); const o=$('#anim'); if(o) o.remove(); } busy=false;
  rs.time-=cost(c);
  if(!r.nf) (FL[c.id]||[]).forEach(f=>rs.flags[f]=1);
  rs.played.push({id:c.id,ed:c.ed,ill,res:r,fl,rep});
  rs.sel=null; sfx('play'); saveRun(); render();
  if(rs.time<=0&&run.phase==='round'){ toast('⏱ Plus de temps : rends ton verdict !'); setTimeout(()=>{ if(run&&run.cur===rs&&!$('#modal').classList.contains('show')) identSheet(); },700); }
  if(ill){ run.illAnte=true; poster(c.id, C.pre.filter(p=>!p.split('|').some(x=>rs.flags[x]))); }
}
function missingTxt(C,rs){ return C.pre.filter(p=>!p.split('|').some(x=>rs.flags[x])).map(p=>p.split('|').map(x=>PREN[x]).join(' ou ')).join(', '); }
function discardSel(){ const rs=run.cur; if(!rs.sel.length||rs.disc<=0) return; rs.hand=rs.hand.filter(c=>{ if(rs.sel.includes(c.u)){ if(!c.temp) rs.discard.push(c); return false;} return true; }); rs.disc--; rs.sel=[]; drawTo(rs,handSize()); sfx('disc'); saveRun(); render(); }

/* ================= GARDE : un objectif, jusqu'à 3 patients, des heures partagées ================= */
const GARDE_H=20;
function newGarde(){ const boss=run.round===2?rand(Object.keys(BOSSES)):null;
  const H=Math.max(8,GARDE_H+(has('etuve')?3:0)+(has('frigo')?2:0)-(boss==='urgence'?5:0)-(has('triple')?4:0));
  const P=Math.max(2,3+(has('porte')?1:0)-((STAKES[run.stake]||{}).lives<3?1:0));
  run.g={target:target(run.ante,run.round),score:0,maxP:P,done:0,hours:H,hoursMax:H,boss,hist:[],bioUsed:false}; syncG(); }
function syncG(){ const g=run&&run.g; if(!g) return; run.maxLives=g.maxP; run.lives=Math.max(0,g.maxP-g.done); }
function gardeState(){ const g=run.g; return g.score>=g.target?'win':(g.done<g.maxP&&g.hours>0)?'next':'fail'; }
function gardeBox(){ const g=run.g, pct=Math.min(100,Math.round(g.score/g.target*100)), left=g.maxP-g.done;
  return `<div class="gbox"><div class="gb-top"><span>🧫 Garde</span><b>${fmt(g.score)} / ${fmt(g.target)}</b></div><div class="gbar"><i style="width:${pct}%"></i></div>
    <div class="gb-meta"><span>👤 ${left} patient${left>1?'s':''} restant${left>1?'s':''}</span><span>⏱ ${g.hours} h restantes</span></div></div>`; }
function gardeBtn(st){ const g=run.g, left=g.maxP-g.done;
  if(st==='win') return `<button class="btn b-gold" style="width:100%" data-act="cash">🏆 Garde réussie : encaisser 💰</button>`;
  if(st==='next') return `<button class="btn b-blue" style="width:100%" data-act="retry">👤 Patient suivant (${left} restant${left>1?'s':''})</button>`;
  if(run.stake===0) return `<button class="btn b-gold" style="width:100%" data-act="cover">🧑‍⚕️ Le biologiste te couvre : continuer</button>`;
  return `<button class="btn b-red" style="width:100%" data-act="over">Fin de la garde…</button>`; }
function gardeVerdict(st){ const g=run.g;
  if(st==='win') return `<div class="verdict good">🏆 Garde réussie !</div>`;
  if(st==='next') return `<div class="verdict">Encore ${fmt(g.target-g.score)} points à trouver</div>`;

/* indices : chaque manip élimine les pistes qui donneraient un autre résultat */
const NOEVID=['clin'];
function evidence(rs){ const pool=poolFor(rs.pr); let cand=pool.slice(); const elim=[];
  rs.played.forEach(p=>{ if(p.ill||!p.res||p.res.nf||NOEVID.includes(p.id)){ elim.push(0); return; } const before=cand.length;
    cand=cand.filter(k=>{ const fake={...rs,bid:k,flags:p.fl||{},contamDone:true}; try{ return result(p.id,BACT[k],fake).d===p.res.d; }catch(e){ return true; } });
    elim.push(before-cand.length); });
  return {elim,cand,pool}; }
function compat(rs,k){ for(const p of rs.played){ if(p.res.nf||NOEVID.includes(p.id)) continue; const fake={...rs,bid:k,flags:p.fl||{},contamDone:true};
  const r=result(p.id,BACT[k],fake); if(r.d!==p.res.d) return CARDS[p.id].n; } return null; }

function computeScore(rs,catChoice,preview){
  /* JETONS = ce que tu trouves (valeur du cas + jetons des manips qui t'apprennent quelque chose) · MULT = ta rigueur, puis les bonus × */
  const b=BACT[rs.bid], steps=[], manips=[], plus=[], minus=[], times=[];
  const done=new Set(); let ill=0,useless=0,reps=0; const E=evidence(rs);
  const manual=rs.played.filter(p=>!p.auto);
  steps.push({l:`🧾 Valeur du cas : ${b.n}`,c:b.base});
  rs.played.forEach((p,idx)=>{ const C=CARDS[p.id];
    if(done.has(p.id)){ reps++; manips.push({l:`🔁 ${C.n} refait : inutile`,c:-20,bad:1}); return; }
    done.add(p.id);
    if(p.ill){ ill++; minus.push({l:`⚠ ${C.n} joué trop tôt`,m:-1,bad:1}); if(rs.boss==='audit') times.push({l:'🕵️ Audit COFRAC',x:.5,bad:1}); return; }
    if(p.res.nf){ useless++; manips.push({l:`${C.n} : rien d'exploitable`,c:0,dim:1}); return; }
    const exam=(FL[p.id]||[]).includes('exam')||['tubeq','serum','qcrach'].includes(p.id), n=E.elim[idx]||0;
    const ref=b.path.includes(p.id)||(b.opt||[]).includes(p.id);
    if(exam||n>0||ref||p.id==='clin'){ manips.push({l:`${C.n}${cLv(p.id)>1?' niv.'+cLv(p.id):''} ✓ ${exam?'(examen direct)':p.id==='clin'?'(contexte)':n>0?`(écarte ${n} piste${n>1?'s':''})`:'(confirme)'}`,c:p.id==='clin'?Math.round(cChips(p.id)/2):cChips(p.id)});
      if(p.ed==='foil') manips.push({l:'✨ Édition brillante',c:30});
      if(p.ed==='holo') plus.push({l:`🌈 ${C.n} holo`,m:2});
      if(p.ed==='poly') times.push({l:`🔮 ${C.n} polychrome`,x:1.5});
      if(has('collec')) manips.push({l:'🧑‍🔬 Paillasse experte',c:15});
    } else { useless++; manips.push({l:`${C.n} : rien de nouveau`,c:0,dim:1}); }
  });
  steps.push(...manips);
  const firstManual=manual[0], examFirst=rs.played.some(p=>p.auto)||!!(firstManual&&((FL[firstManual.id]||[]).includes('exam')||['tubeq','serum','qcrach','clin'].includes(firstManual.id)));
  const iT=manual.findIndex(p=>['test','ident'].includes(CARDS[p.id].t)), iG=manual.findIndex(p=>p.id==='gram');
  const gramOk=iT<0||!b.path.includes('gram')||(iG>=0&&iG<iT);
  const order=ill===0&&reps===0&&examFirst&&gramOk&&manual.length>=Math.min(2,b.path.length);
  const proven=E.cand.length===1&&E.cand[0]===rs.bid;
  if(order) plus.push({l:'🧭 Démarche propre',m:2});
  if(proven) plus.push({l:'🔎 Diagnostic prouvé (1 seule piste restante)',m:2});
  if(has('huile')&&examFirst) plus.push({l:'🧐 Rigueur pré-analytique',m:3});
  if(has('urino')&&b.cc==='CTRL'&&(preview||catChoice==='CTRL')) plus.push({l:'🕵️ Détective qualité',m:4});
  if(has('fiches')){ const n=new Set([...(run.seen||[]),rs.bid]).size; plus.push({l:'📚 Fiches de révision',m:n}); }
  if(has('cafe')&&rs.time>=3) plus.push({l:'☕ Machine à café',m:2});
  if(has('qual')&&ill===0) times.push({l:'📋 Démarche qualité',x:2});
  if(has('entero')&&(b.cc==='CRIT'||b.danger)) times.push({l:"🚨 Chasseur d'urgences",x:1.5});
  if(has('lynx')&&manual.length<=4) times.push({l:'🎯 Œil de lynx',x:3});
  if(has('copro')&&(run.discs||[]).length>=2) times.push({l:'🌈 Polyvalent',x:2});
  const JS=run.jst||{}, gg=run.g;
  if(has('habit')&&JS.habit) steps.push({l:'📈 Routine du labo',c:JS.habit});
  if(has('roi')&&JS.roi) plus.push({l:"👑 Roi de l'ECBU",m:JS.roi});
  if(has('sang')&&(b.cc==='CRIT'||b.danger)) plus.push({l:'🧊 Sang-froid',m:3});
  if(has('scept')&&(b.ras||b.cc==='CTRL')) plus.push({l:'🤨 Œil du sceptique',m:4});
  if(rs.ev==='interne'&&order) plus.push({l:'🎓 L\'interne est impressionné',m:2});
  if(has('pip')&&proven) times.push({l:'🏅 Pipette dorée',x:3});
  if(has('triple')) times.push({l:'⚡ Triple expresso',x:2});
  if(has('nuit')&&run.round===2) times.push({l:'🌙 Interne de nuit',x:2});
  if(has('chef')&&gg){ const left=Math.max(0,gg.maxP-gg.done-1); if(left>0) times.push({l:`👔 Chef de service (${left} patient${left>1?'s':''} en réserve)`,x:Math.round(Math.pow(1.5,left)*100)/100}); }
  if(rs.ev==='medecin') times.push({l:'📞 Résultat urgent',x:1.5});
  if(rs.ev==='vip') times.push({l:'⭐ Patient VIP',x:2});
  steps.push(...plus,...minus,...times);
  const catOk=catChoice===b.cc;
  if(!preview){ if(catOk) steps.push({l:'💊 Bonne conduite à tenir',x:2}); else steps.push({l:'💊 Mauvaise conduite à tenir',x:.5,bad:1}); }
  let chips=0, mult=1; steps.forEach(st=>{ if(st.c) chips+=st.c; if(st.m) mult=Math.max(1,mult+st.m); if(st.x) mult=Math.max(st.x<1?.5:1,mult*st.x); });
  chips=Math.max(0,chips); mult=Math.round(mult*100)/100;
  return {steps,chips,mult,final:Math.floor(chips*mult),ill,useless,reps,catOk,order,proven,cand:E.cand.length,manual:manual.length};
}

/* conseil du maître de stage (mise Stagiaire) : règles générales de démarche, sans donner la réponse */
function hintFor(rs){ const f=rs.flags, b=BACT[rs.bid], sel=rs.pr==='selles';
  if(rs.pr==='ih'){ if(!f.exam) return [['tubeq'],"Contrôle le tube EDTA et l'identité : le groupage ne tolère aucune erreur."];
    if(!f.bv) return [['bv','sim','rhd'],"Beth-Vincent (antigènes) et Simonin (anticorps) doivent être concordants, puis l'anti-D avec ses témoins."];
    return [['sim','rhd','tem','rai'],"Vérifie la concordance avec Simonin, fais les témoins (auto, AB, allo) et la RAI si la clinique l'exige."]; }
  if(rs.pr==='sero'){ if(!f.exam) return [['serum'],"Centrifuge et regarde le sérum avant les dosages."];
    return [['elisa','avid','tdrs','ige','clin'],"IgM = infection récente, IgG = ancienne ou immunité. L'avidité des IgG date l'infection. Un dépistage positif se confirme toujours."]; }
  if(rs.pr==='hema'||rs.pr==='bio'){ const ex=rs.pr==='hema'?'tubeq':'serum';
    if(!f.exam) return [[ex],rs.pr==='hema'?"Contrôle d'abord le tube : bon anticoagulant, bien rempli, sans caillot.":"Centrifuge et regarde le sérum : hémolysé, ictérique ou lactescent ? Ça peut fausser les dosages."];
    if(b.asp==='bad'||b.asp==='hemo') return [[],"Le tube n'est pas conforme : à toi de décider s'il faut vraiment continuer…"];

/* Animation façon Balatro : la carte s'envole, grossit, se retourne sur la manip, puis sur le résultat */
async function playAnim(id,r,u,ill,rep){
  if(RM){ if(rep) toast('🔁 Manip déjà faite : −20 jetons'); return; }
  const C=CARDS[id], b=BACT[run.cur.bid];
  const src=document.querySelector(`.tgrid .card[data-u="${u}"]`);
  const ov=document.createElement('div'); ov.id='anim'; document.body.appendChild(ov);
  let skip=false; ov.addEventListener('click',()=>{ skip=true; });
  const T=ms=>skip?1:ms, wait=ms=>skip?Promise.resolve():sleep(ms);
  const W=Math.min(250,innerWidth*.66), H=Math.round(W*1.36), cx=innerWidth/2, cy=innerHeight*.43;
  const box=document.createElement('div'); box.className='fly'; Object.assign(box.style,{width:W+'px',height:H+'px',left:(cx-W/2)+'px',top:(cy-H/2)+'px'}); ov.appendChild(box);
  const sr=src?src.getBoundingClientRect():{left:cx-37,top:innerHeight-130,width:74,height:110};
  if(src) src.style.visibility='hidden';
  const dx=sr.left+sr.width/2-cx, dy=sr.top+sr.height/2-cy, s0=sr.width/W;
  const inner=document.createElement('div'); inner.className='sway'; box.appendChild(inner);
  inner.innerHTML=bigFace(id,`<div class="big-art">${C.art()}</div>`,`⏱ ${cost({id})} · +${C.ch} jetons`);
  tone(330,.06);
  await box.animate([{transform:`translate(${dx}px,${dy}px) scale(${s0}) rotate(${(Math.random()-.5)*20}deg)`},{transform:'translate(0,-12px) scale(1.07) rotate(-4deg)',offset:.7},{transform:'translate(0,0) scale(1) rotate(0deg)'}],{duration:T(380),easing:'cubic-bezier(.2,1.2,.4,1)',fill:'forwards'}).finished;
  await wait(120);
  const flip=async html=>{ await box.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:T(110),easing:'ease-in',fill:'forwards'}).finished;
    inner.innerHTML=html; await box.animate([{transform:'scaleX(0) scaleY(1.06)'},{transform:'scaleX(1.08) scaleY(.97)',offset:.7},{transform:'scaleX(1)'}],{duration:T(180),easing:'ease-out',fill:'forwards'}).finished; };
  /* la carte se « consume » et on passe en vue à la 1re personne sur la paillasse */
  const br0=box.getBoundingClientRect(); burst(br0.left+br0.width/2,br0.top+br0.height/2,18,['#F5B143','#FFFFFF','#7FB3E6']);
  await box.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.2) rotate(30deg)',opacity:0}],{duration:T(200),easing:'ease-in',fill:'forwards'}).finished;
  const stage=document.createElement('div'); stage.className='pxstage'; ov.appendChild(stage); stage.animate([{opacity:0,transform:'scale(1.15)'},{opacity:1,transform:'none'}],{duration:T(220),fill:'forwards'});
  tone(440,.05);
  await Promise.race([runScene(stage,id,b,1900,r.d), new Promise(rs=>{ const iv=setInterval(()=>{ if(skip){ clearInterval(iv); rs(); } },40); })]);
  if(stage._stop) stage._stop();
  await stage.animate([{opacity:1},{opacity:.35}],{duration:T(180),fill:'forwards'}).finished;
  box.animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:T(10),fill:'forwards'});
  const [tag,tc]=shortTag(id,b,r);
  await flip(bigFace(id,`<div class="big-res">${r.svg}</div><div class="big-tag" style="color:${tc}">${tag}</div><div class="big-d">${r.d}</div>`));
  const br=box.getBoundingClientRect(); burst(br.left+br.width/2,br.top+br.height*.42,30); shake($('#app'),5); tone(660,.08); setTimeout(()=>tone(880,.1),70);
  floatTxt(br.left+18,br.top+18,`−${cost({id})} ⏱`,'#1E9BFF');
  if(ill) setTimeout(()=>{ floatTxt(br.right-24,br.top+30,'−1 MULT','#FE5F55'); shake(box,8); tone(160,.2,'sawtooth'); },220);
  if(rep) setTimeout(()=>{ floatTxt(br.left+br.width/2,br.top+br.height*.75,'🔁 DÉJÀ FAIT · −1 MULT','#B9342C'); shake(box,6); tone(200,.18,'sawtooth'); },420);
  await wait(ill?1000:650);
  const bench=$('#bench'); const bt=bench?bench.getBoundingClientRect():{left:cx,top:cy,width:0};
  await box.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${bt.left+40-cx}px,${bt.top+30-cy}px) scale(.18) rotate(8deg)`,opacity:.2}],{duration:T(300),easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'}).finished;
  ov.remove();
}

/* ================= SCÈNE PIXEL-ART EN VUE À LA 1re PERSONNE ================= */
const PW=192, PH=128;
const LAB = (()=>{ const r=rng(42); const blds=[]; let x=9;
  while(x<70){ const w=6+Math.floor(r()*8), h=14+Math.floor(r()*30); const win=[]; for(let yy=60-h+3; yy<58; yy+=4) for(let xx=x+1; xx<x+w-1; xx+=3) if(r()<.55) win.push([xx,yy,r()<.15,r()*6,['#F5D76E','#7FD1F5','#F59AC0'][Math.floor(r()*3)]]); blds.push({x,w,h,win,c:['#1C2A4A','#22305A','#18223E'][Math.floor(r()*3)]}); x+=w; }
  const rain=Array.from({length:40},()=>[9+r()*61, r()*52+8, .6+r()*.8]);
  const bottles=[['#E25A9A',5,10],['#6B3FB8',4,12],['#F2E36B',6,8],['#4BC292',4,11],['#7FD1F5',5,9],['#E0823A',4,12]];
  return {blds,rain,bottles}; })();
function P(ctx,x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
function ELL(ctx,cx,cy,rx,ry,c){ for(let y=-ry;y<=ry;y++){ const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry)))); P(ctx,cx-w,cy+y,2*w+1,1,c); } }
function CIRC(ctx,cx,cy,rr,c){ ELL(ctx,cx,cy,rr,rr,c); }
/* petite police 3x5 pour les chiffres de l'horloge */
const DIG={0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',5:'111100111001111',6:'111100111101111',7:'111001001001001',8:'111101111101111',9:'111101111001111','.':'000000000000010','°':'110110000000000',C:'111100100100111'};
function TXT(ctx,s,x,y,c){ [...s].forEach((ch,i)=>{ const m=DIG[ch]; if(!m) return; for(let k=0;k<15;k++) if(m[k]==='1') P(ctx,x+i*4+(k%3),y+Math.floor(k/3),1,1,c); }); }

function drawLabBG(ctx,t,noBench){

  for(let y=8;y<34;y++) P(ctx,8,y,63,1, y<20?'#101C40':'#142450');
  LAB.blds.forEach(b=>{ P(ctx,b.x,60-b.h,b.w,b.h+2,b.c); b.win.forEach(([wx,wy,fl,ph,col])=>{ const on=!fl||Math.sin(t*3+ph)>-.2; if(on) P(ctx,wx,wy,1,2,col); }); });

  /* lampe suspendue + cône de lumière */

  ctx.globalAlpha=.07+.02*Math.sin(t*5); ctx.fillStyle='#FFE9A8'; ctx.beginPath(); ctx.moveTo(92,31); ctx.lineTo(106,31); ctx.lineTo(150,128); ctx.lineTo(48,128); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  if(noBench) return;
  /* paillasse */

/* main gantée : x,y = haut de la paume ; la manche de blouse descend jusqu'au bas de l'écran */
function HAND(ctx,x,y,flip,pose='grip'){

  if(pose==='grip'){ P(ctx,x-9,y-6,18,5,'#5FA8E8'); for(let i=1;i<4;i++) P(ctx,x-9+i*4.5,y-6,1,5,'#3E7FC4'); }
  else { for(let i=0;i<4;i++) P(ctx,x-8+i*4.5,y-10+(i===0||i===3?3:0),3,9,'#5FA8E8'); }

}
function DROPPER(ctx,x,yTip,col){ P(ctx,x-1,yTip-22,3,22,'#CFE6F5'); P(ctx,x,yTip-14,1,13,col); P(ctx,x-2,yTip-29,5,8,'#D94848'); P(ctx,x-2,yTip-29,1,8,'#F08080'); }

const AGAR={anaer:'#A8323C',cled:'#9FC6E8',cos:'#A8323C',chap:'#D8565E',emb:'#6E3B6E',cetri:'#C9DDB0',hek:'#4C8A5A',tcbs:'#4E9A7A',sab:'#E9D79A',campy:'#3B3B3B',cin:'#E6B9B0',smac:'#C9506E',repiq:'#E8D9B5'};
function colonyCol(id,b){ const m={cled:{J:'#F2E36B',B:'#3E73C9',W:'#FBF8F0'}[b.cled],chap:b.chap==='J'?'#F2E36B':b.chap?'#F4F0E6':null,cetri:b.cetri?'#5FB86F':null,hek:{S:'#E6955A',N:'#1E1A18',V:'#3E9A6A'}[b.hek],emb:{M:'#2A2030',L:'#5A3070',I:'#E8DDE8'}[b.emb],tcbs:b.tcbs?'#F2E36B':null,sab:b.sab?'#FBF8F0':null,campy:b.campy?'#BDBDBD':null,cin:b.cin?'#F6EDEA':null,cos:b.cos?'#E9E4D8':null,anaer:'#D8D2C2',smac:'#F4E9E6',repiq:'#F4F0E6'}; return id in m?m[id]:'#F4F0E6'; }
const STREAK=(()=>{ const pts=[]; for(let i=0;i<=60;i++){ const s=i/60; const zig=(i%10)/10; pts.push([74+s*44, 96+Math.sin(s*Math.PI*6)*5+ (zig<.5?0:1)]); } return pts; })();

function drawScene(ctx,kind,id,b,s,t,cap){

/* lecture de la scène dans une boucle d'animation */
function runScene(host,id,b,dur,rtxt){ return new Promise(res=>{
  const cv=document.createElement('canvas'); cv.width=PW; cv.height=PH; cv.className='pxscene'; host.appendChild(cv);
  const capEl=document.createElement('div'); capEl.className='pxcap'; host.appendChild(capEl);
  const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false; const kind=KIND(id); const t0=performance.now();
  const cap=txt=>{ if(capEl.textContent!==txt) capEl.textContent=txt; }; cap.res=rtxt;
  let stop=false; host._stop=()=>{stop=true;};
  const f=now=>{ const t=(now-t0)/1000, s=Math.min(1,t/(dur/1000)); try{ drawScene(ctx,kind,id,b,s,t,cap); }catch(e){ console.error(e); res(); return; } if(s<1&&!stop) requestAnimationFrame(f); else res(); };
  requestAnimationFrame(f);
}); }

function renderHowto(){ app.innerHTML=`<div class="screen"><div class="topbar"><h2>❔ Règles</h2><button class="icon-btn" data-act="title">✕</button></div><div class="scroll panel" style="padding:14px">

  <h3>🧰 La boîte à outils</h3><p>Tous tes outils débloqués sont disponibles : c'est toi qui vas chercher la bonne manip. Chaque outil coûte du temps (20 ⏱ à partager sur toute la garde).</p>
  <h3>🔬🩸⚗️ Les modes</h3><p>Choisis Microbiologie, Hématologie ou Biochimie (ou Tout le labo à partir du niveau 4). Bactériologie (ECBU, selles, pus, crachat), hématologie (NFS, frottis, hémostase) et biochimie (glycémie, ionogramme, troponine…). Le but est toujours de trouver l'anomalie : une bactérie, une maladie… ou un tube non conforme !</p>
  <h3>🔁 L'efficacité</h3><p>Refaire une manip déjà faite ne sert à rien au labo : −20 jetons, et tu perds le bonus de démarche propre. Une petite icône 🔁 te prévient sur la carte.</p>

  <h3>🧠 La démarche</h3><p>Respecte l'ordre logique : examen direct → Gram → culture → tests. Jouer une carte trop tôt (oxydase sans culture, catalase sur gélose au sang…) = <b>démarche illogique</b> : une affiche t'explique ton erreur et tu perds 1 mult.</p>
  <h3>💯 Le score</h3><p><b style="color:var(--chips)">Jetons</b> × <b style="color:var(--mult)">Mult</b>, et seulement si ton <b>diagnostic est juste</b> (sinon le patient rapporte 0). Les <b style="color:var(--chips)">jetons</b> = la valeur du cas + les jetons de chaque manip utile : elle écarte au moins une piste, ou elle confirme le diagnostic comme dans la démarche de référence. Une manip qui n'apporte rien rapporte 0. Le <b style="color:var(--mult)">mult</b> = ta rigueur : 1, +2 démarche propre, +2 diagnostic prouvé (une seule piste restante), −1 par manip jouée trop tôt, puis les bonus ×, et la conduite à tenir : ×2 si bonne, ×0,5 sinon. « Si tu rends » en haut montre ton score en direct.</p>
  <h3>🎯 Les gardes</h3><p>Une journée = 3 gardes : petite, grosse, puis une garde <b>boss</b> avec une règle spéciale. Chaque garde réussie rapporte des 💰 et ouvre la boutique.</p>

  <h3>🔎 Les pistes</h3><p>Chaque résultat élimine des pistes. En haut de la paillasse, tu vois combien il en reste (et lesquelles aux premiers niveaux). Une seule piste = diagnostic prouvé, +2 mult.</p>
  <h3>🎲 Les événements</h3><p>Dès le niveau 3, un patient sur trois arrive avec un événement : café offert, médecin pressé (×1,5 mais −2 h), automate capricieux, réactif périmé, patient VIP (×2)…</p>
  <h3>💎 Raretés et fiches techniques</h3><p>Les équipements sont <b>communs</b>, <b>peu communs</b>, <b>rares</b> ou <b>légendaires</b> (Chef de service, Pipette dorée…). Certains évoluent pendant la partie. Les <b>fiches techniques</b> montent un outil de niveau : +10 jetons par niveau et −1 h dès le niveau 3 (points bleus sur la carte).</p>
  <h3>♾️ Le mode infini</h3><p>Après la journée 8, continue sans fin : les objectifs deviennent exponentiels.</p>
  <h3>🛒 La boutique</h3><p>Achète des <b>équipements</b> (effets permanents, 5 max) et des cartes en plus, parfois en édition brillante (+30 jetons), holo (+2 mult) ou polychrome (×1,5).</p>
  <h3>⬆️ La progression</h3><p>Tu gagnes de l'XP à chaque identification et avec les trophées. Les niveaux débloquent de nouvelles cartes, de nouvelles bactéries et la coproculture.</p>
  </div></div></div>`; }

  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0008,t+d);

  if(k%8===0||(lost>=1&&k%4===0)) musNote(k%8===0?60:52,t,.18,'sine',.5);
  if(k%2===1) musNoise(t,.03,inGame?.06:.03);

  if(inGame&&[0,3,6,10,13].includes(k)) musNote(ARP[(k+bar)%4]*(lost>=2?2:1),t,.12,'square',.025,1800);

const PROF_GRID=(()=>{ const W=34,H=44,g=[...Array(H)].map(()=>Array(W).fill('.'));

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const dx=(x-16.5)/6.6, dy=(y-12)/7.8; if(dx*dx+dy*dy<=1) set(x,y,'K'); }
  for(let y=0;y<5;y++) for(let x=10;x<=23;x++) if(!(y===0&&(x<12||x>21))) set(x,y,'K'); for(let x=5;x<=28;x++){ set(x,5,'K'); set(x,6,'K'); }
  for(let y=17;y<24;y++){ for(let x=9;x<=12;x++) set(x+(y>21?-1:0),y,'K'); for(let x=21;x<=24;x++) set(x+(y>21?1:0),y,'K'); }
  for(let y=19;y<23;y++) for(let x=14;x<20;x++) set(x,y,'K');
  for(let y=22;y<H;y++){ const hw=Math.min(15.5,6+(y-22)*1.35); for(let x=Math.round(16.5-hw);x<=Math.round(16.5+hw);x++) set(x,y,'K'); }

  [[13,16],[14,16],[15,17],[16,17],[17,17],[18,17],[19,16],[20,15],[21,14]].forEach(([x,y])=>set(x,y,'S'));
  for(let y=25;y<36;y++){ set(28,y,'T'); set(29,y,'T'); } set(27,24,'T'); set(30,24,'T'); for(let y=30;y<36;y++){ set(28,y,'L'); set(29,y,'L'); }
  for(let y=34;y<39;y++) for(let x=26;x<32;x++) set(x,y,'K');
  for(let y=1;y<H;y++) for(let x=0;x<W;x++){ if(g[y][x]!=='K') continue; const L=x===0||g[y][x-1]==='.', T=g[y-1][x]==='.', Rr=x===W-1||g[y][x+1]==='.';

function seriesBanner(C,n,saved){ if(RM) { toast(`Série de ${n} : ${durTxt(saved)} gagnées !`); return; } const el=document.createElement('div'); el.className='serban';
  el.innerHTML=`<b>SÉRIE ×${n}</b><span>${C.n} · ${durTxt(saved)} gagnées !</span>`; document.body.appendChild(el); tone(660,.08,'square'); setTimeout(()=>tone(880,.1,'square'),90); setTimeout(()=>el.remove(),1700); }
function lateCheck(){ const N=run.n; N.ds.forEach(D=>{ if(!D.done&&D.due!=null&&N.clock>D.due&&!D.lateW){ D.lateW=1; N.res.late++; addWarn(1,`⏰ Urgence en retard : ${D.pat.nm}`,'late'); } }); }

/* ---------------- rendre un dossier ---------------- */
function dossierSheet(pick,pc){ const N=run.n, D=nowD(), E=candOf(D), h=helpLv(), alive=new Set(E.cand);
  const list=E.pool.slice().sort((a,b)=>(alive.has(b)-alive.has(a))||BACT[a].n.localeCompare(BACT[b].n));
  sheet(`<div class="shead"><div><div class="muted" style="font-size:12px">${D.pat.nm} · ${PRN[D.pr]}</div><h2>Rendre le dossier</h2></div><button class="btn b-gray" data-act="closeS">✕</button></div>
    <h3>1. Diagnostic</h3>${h>=1?`<p class="muted" style="margin:0 0 6px">🔎 ${E.cand.length} piste${E.cand.length>1?'s':''} compatible${E.cand.length>1?'s':''} avec tes résultats.</p>`:''}
    <div class="idgrid">${list.map(k=>`<button class="idb ${pick===k?'on':''} ${h>=2&&!alive.has(k)?'off':''}" data-act="dpick" data-k="${k}">${BACT[k].ras?'✅ ':''}${BACT[k].n}</button>`).join('')}</div>
    <h3>2. Conduite à tenir</h3><div class="cat">${CATSETS[DISC(D.pr)].map(c=>`<button class="btn ${pc===c?'b-gold':'b-gray'}" style="font-size:14px;text-align:left" data-act="dpc" data-c="${c}" data-k="${pick||''}">${CATS[c]}</button>`).join('')}</div>
    ${pc&&h>=1?`<div class="catx">💊 ${CATEXPL[pc]||''}</div>`:''}
    <div style="margin-top:12px"><button class="btn b-orange" style="width:100%" data-act="drend" data-k="${pick||''}" data-c="${pc||''}" ${pick&&pc?'':'disabled'}>📋 Valider et rendre le dossier</button></div>`); }
/* pourquoi le diagnostic choisi était faux : quel résultat le contredisait, ou quel outil aurait départagé */
function whyWrong(D,bid){ const B=BACT[bid], T=BACT[D.bid], fk=(k,fl)=>({...D,bid:k,flags:fl||D.flags,contamDone:true});
  for(const p of D.played){ if(p.ill||!p.res||p.res.nf||p.id==='clin') continue; let o; try{ o=result(p.id,B,fk(bid,p.fl)); }catch(e){ continue; }
    if(o&&o.d!==p.res.d) return `🔍 <b>Ce qui contredisait ta réponse :</b> ton <b>${CARDS[p.id].n}</b> montrait « ${p.res.d} », alors que <i>${B.n}</i> aurait donné « ${o.d} ».`; }
  const tools=nTools().filter(k=>k!=='clin'&&CARDS[k].pr.includes(D.pr));
  for(const k of tools){ let a,b; try{ a=result(k,T,fk(D.bid,{...D.flags,exam:1,gram:1,culture:1,catok:1,oxok:1})); b=result(k,B,fk(bid,{...D.flags,exam:1,gram:1,culture:1,catok:1,oxok:1})); }catch(e){ continue; }
    if(a&&b&&!a.nf&&!b.nf&&a.d!==b.d) return `🔍 <b>Tes résultats ne permettaient pas encore de trancher</b> entre <i>${T.n}</i> et <i>${B.n}</i>. ${D.played.some(p=>p.id===k)?'':`<b>${CARDS[k].n}</b> les aurait départagés : « ${a.d} » pour <i>${T.n}</i>, « ${b.d} » pour <i>${B.n}</i>.`} Astuce : rends le dossier quand il ne reste qu'<b>une seule piste</b>.`; }
  return `🔍 Avec tes outils actuels, <i>${T.n}</i> et <i>${B.n}</i> se ressemblent beaucoup : regarde bien les caractères clés de la fiche ci-dessous.`; }
function judge(bid,cc){ const N=run.n, D=nowD(), b=BACT[D.bid], E=candOf(D);
  const okD=bid===D.bid, okC=cc===b.cc;
  const grave=(b.danger&&cc!==b.cc&&(DISC(D.pr)==='bact'?cc!=='NO':cc==='VAL'))||(!okD&&cc==='VAL'&&(b.cc==='CRIT'||b.cc==='CTRL'));
  D.done=true; D.at=N.clock; let kind;
  if(grave){ kind='grave'; N.res.grave++; run.stats.grave++; }
  else if(okD&&okC){ kind='ok'; N.res.ok++; run.stats.ok++; N.streak++; run.ids++; const proven=E.cand.length===1, clean=!D.ill, urgOk=D.due!=null&&N.clock<=D.due;
    D.bon={clean,proven,urgOk};
    if(!meta.found.includes(D.bid)){ meta.found.push(D.bid); saveMeta(); } trophy&&trophy('first'); }
  else { kind='err'; N.res.err++; run.stats.err++; N.streak=0; }
  D.out={kind,bid,cc}; saveRun();
  let over=false; if(kind==='grave') over=AIDE().help===3?addWarn(2,'Faute grave','grave'):(nope('grave',b.alert||'Faute grave'),runOver('grave',b.alert||'Faute grave',2200),true);
  else if(kind==='err') over=addWarn(1,okD?'Mauvaise conduite à tenir':'Mauvais diagnostic');
  const why=CATEXPL[b.cc]||'';
  sheet(`<div class="stampbox"><div class="stamp ${kind}">${kind==='ok'?'VALIDÉ':kind==='grave'?'FAUTE GRAVE':'ERREUR'}</div></div>
    <h2 class="center" style="margin:6px 0">${kind==='ok'?`✅ ${b.n}`:`Réponse : ${b.n}`}</h2>
    ${kind==='ok'?`<div class="bonus">${[D.bon.proven?'🔎 diagnostic prouvé':'',D.bon.clean?'🧭 démarche propre':'⚠️ une manip jouée trop tôt',D.bon.urgOk?'⏰ urgence rendue à temps':''].filter(Boolean).map(x=>`<span>${x}</span>`).join('')}</div>`
      :`<p class="center">Tu as rendu <i>${BACT[bid].n}</i> · ${CATS[cc]}.${!okD?'':' Le diagnostic était bon, mais pas la conduite.'}</p>${!okD?`<div class="catx why">${whyWrong(D,bid)}</div>`:''}${kind==='grave'&&b.alert?`<div class="alert">☠️ ${b.alert}</div>`:''}`}
    <div class="catx">💡 <b>Pourquoi « ${CATS[b.cc]} » ?</b> ${why}</div>
    ${bactFiche(D.bid)}
    <div style="margin-top:12px"><button class="btn b-blue" style="width:100%" data-act="dback">${over?'…':'Retour au portoir'}</button></div>`,1);
  if(kind==='ok'){ sfx('win'); if(typeof profCorner==='function'&&N.streak>=3&&N.streak%3===0) setTimeout(()=>profCorner(rand(["Trois d'affilée. Pas mal. 😏","Tu commences à me plaire.","Continue comme ça, je note."]),'wink',3200),400); } }

function endNight(){ const N=run.n; if(run.phase!=='night') return; const left=N.ds.filter(D=>!D.done);
  run.phase='morning'; let over=false; left.forEach(D=>{ N.res.late++; }); if(left.length){ nope('late',`${left.length} dossier${left.length>1?'s':''} non rendu${left.length>1?'s':''} à 8 h`); run.warn+=left.length; toast(`⏰ ${left.length} dossier${left.length>1?'s':''} non rendu${left.length>1?'s':''} : +${left.length} avertissement${left.length>1?'s':''}`); if(run.warn>=maxWarn()) over=true; }
  if(over){ runOver('vire','Dossiers non rendus à 8 h',700); return; }
  const hl=Math.max(0,Math.floor((N.end-N.clock)/60)); N.res.hours=hl;
  const errs=N.res.err+N.res.grave*2+N.res.late; N.res.grade=errs===0?(hl>=2?'S':'A'):errs===1?'B':errs===2?'C':'D';
  run.best=Math.max(run.best,N.num); meta.bestN=meta.bestN||{}; const key=run.mode+'_'+run.aide; meta.bestN[key]=Math.max(meta.bestN[key]||0,N.num); saveMeta();
  N.res.xpBase=10+5*N.res.ok+(N.res.grade==='S'?8:0); N.res.xp=Math.round(N.res.xpBase*AXP[run.aide||0]); N.res.rec=N.num>(N.prevBest||0); try{ addXp(N.res.xp); }catch(e){} saveRun(); go('game'); }
function runOver(kind,why,delay){ if(!run||run.phase==='over') return; run.phase='over'; run.overKind=kind; run.overWhy=why; meta.bestN=meta.bestN||{}; const key=run.mode+'_'+run.aide;
  const nights=Math.max(0,run.night-1); meta.bestN[key]=Math.max(meta.bestN[key]||0,nights); saveMeta(); run.overNights=nights; saveRun();

function renderHowto(){ app.innerHTML=`<div class="screen"><div class="shead"><h2>Comment jouer</h2><button class="btn b-gray" data-act="home">✕</button></div><div class="panel howto">

  <h3>🧰 Les séries</h3><p>Touche un outil, puis les tubes à traiter, puis « Lancer la série » : la manip est faite sur tous les tubes en même temps, pour la durée d'une seule. Au début, une seule à la fois ; ton matériel augmente ensuite la capacité (2 lames de Gram, 3 boîtes…).</p>
  <h3>🔎 Les pistes</h3><p>Chaque résultat élimine les diagnostics impossibles. Une seule piste restante = diagnostic prouvé : tu peux rendre sans risque. Les manips jouées trop tôt (sans leurs prérequis) ne comptent pas.</p>
  <h3>📋 Rendre un dossier</h3><p>Choisis le diagnostic (bactérie, pathologie, « rien d'anormal » ou piège pré-analytique) et la conduite à tenir. Faux = avertissement. Faute grave (valider une valeur critique, antibiotique dans une diarrhée toxinique, rendre un tube non conforme) = renvoi, sauf en Stagiaire.</p>
  <h3>⚠️ Avertissements</h3><p>Erreur, urgence en retard ou dossier non rendu à 8 h : +1. Trop d'avertissements = viré, et tu recommences à la nuit 1.</p>
  <h3>🎯 La mission du matin</h3><p>Après chaque nuit, une mission de révision sur ton poste : ordre du Gram, démarche, qui suis-je, lecture de gélose, bon tube, conduite à tenir, calcul, groupage, vrai ou faux… Sans limite de temps en Stagiaire, chronométrée ensuite. Réussie = tu choisis un matériel ; ratée = pas de matériel cette fois (mais la réponse t'est expliquée).</p>
  <h3>🧰 Le matin</h3><p>Bilan de la nuit (note S à D), puis tu choisis un nouveau matériel parmi trois : portoir de lames, pipette multicanaux, râtelier à tests, centrifugeuse, automate… Chacun permet de traiter un tube de plus par série. Les nuits suivantes ont plus de dossiers, d'urgences et d'arrivées en cours de nuit.</p>

  const o=AC.createOscillator(), g=AC.createGain(), fl=AC.createBiquadFilter(); o.type=kind||'square'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*(v?1.25:.85),t+.05);

  const bl=Math.sin(t*2.7)>.94; if(!bl){ P(ctx,x-3,y-27,2,1,'#fff2a8'); P(ctx,x+1,y-27,2,1,'#fff2a8'); ctx.globalAlpha=.25; P(ctx,x-4,y-28,8,3,'#fff2a8'); ctx.globalAlpha=1; }
  if(item==='paper'){ P(ctx,x+6,y-16-step,7,9,'#e9e4d6'); P(ctx,x+7,y-14-step,5,1,'#9aa6b0'); P(ctx,x+7,y-12-step,4,1,'#9aa6b0'); P(ctx,x+7,y-10-step,5,1,'#9aa6b0'); }
  if(item==='rack'){ P(ctx,x+5,y-11,12,2,'#3a4654'); ['#F2D16B','#B23A3A','#3A6ED8','#7B4FC9'].forEach((c,i)=>{ P(ctx,x+6+i*3,y-17,2,6,c); P(ctx,x+6+i*3,y-18,2,1,'#ddd'); }); }
  if(item==='plate'){ P(ctx,x+5,y-14,11,3,'#cfd6dc'); P(ctx,x+6,y-16,9,2,'#B8323C'); } }
window.bioHook=function(ctx,t){ const c=t%34, k=Math.floor(t/34)%4, BY=96; if(c>11) return;
  if(k===0){ const x=262+((Math.floor(t/136)%3)*70), up=Math.min(1,c/1.2,(11-c)/1.2); bioFig(ctx,x,BY+30-up*18,t,null,true); return; }
  const it=['paper','rack','plate'][k-1], x=-14+c/11*508; bioFig(ctx,x,BY+12,t,it,false); };
{ const _dl=drawLabBG; drawLabBG=function(ctx,t,noBench){ const keep=window.__animBio; window.__animBio=false; _dl(ctx,t,noBench); window.__animBio=keep; try{ if(keep&&screen==='game'){ const x=-10+((t*26)%240); ctx.globalAlpha=.8; bioFig(ctx,x,112,t,['paper','rack','plate'][Math.floor(t)%3],false); ctx.globalAlpha=1; } }catch(e){} }; }

/* ===================== v11 · paillasse : tuiles avec image et nom de la manip ===================== */
function tileCap(id,b){ const C=CARDS[id]; if(id==='api'&&b&&b.api) return b.api.split(':')[0].replace(/^API/,'Galerie API').trim()+' · Identification';
  const T={dos:'Dosage',exam:'Examen direct',micro:'Microscopie',milieu:'Culture',test:'Test',ident:'Identification',clin:'Renseignements',spe:'Spectrométrie',tube:'Contrôle',qcrach:'Examen direct'}[C.t]||'';
  return `${C.n}${T?' · '+T:''}`; }

ACT.dinfo=()=>explain('dos:'+run.n.focus);
/* ===================== v12 · fiche clinique utile : les renseignements sont cachés tant qu'on ne l'a pas lue ===================== */
const ctxShown=D=>!nTools().includes('clin')||D.played.some(p=>p.id==='clin');
if(CARDS.clin){ CARDS.clin.d="Lire les renseignements cliniques : contexte, voyage, traitement, antécédents. Sans elle, tu ne connais que l'âge et le prélèvement."; CARDS.clin.read="Elle oriente vers les recherches ciblées (TCBS, toxines, sérotypage…) et explique les pièges (tube, traitement)."; }
{ const _r=result; result=function(id,b,rs){ if(id==='clin'&&run&&run.v===5&&rs&&rs.ctx&&!(rs.boss==='fiche')) return {d:`${rs.ctx}${b.clin?' · '+b.clin:''}`,svg:R.sheet()}; return _r.apply(this,arguments); }; }
{ const _ex=explain; explain=function(k){ const [t,a]=k.split(':'); if(t==='dos'&&run&&run.n){ const D=run.n.ds[+a]; if(D&&!ctxShown(D)){ const keep=D.ctx; D.ctx='🔒 Renseignements cachés : lis la fiche clinique (0 h) pour les voir.'; try{ _ex(k); } finally{ D.ctx=keep; } return; } } return _ex(k); }; }

/* ===================== v12 · résumé compact + paillasse simulée au clic sur le prélèvement ===================== */
function dSummary(D){ const N=run.n; if(!D.played.length) return '';
  return `<div class="dsum">${D.played.map((p,j)=>{ let t; try{ t=p.ill?['TROP TÔT','#FF4D6D']:shortTag(p.id,BACT[D.bid],p.res); }catch(e){} return `<span class="dchip" style="--tc:${(t&&t[1])||'#9AA6B0'}"><small>${String(j+1).padStart(2,'0')} · ${CARDS[p.id].n}</small>${(t&&t[0])||'—'}</span>`; }).join('')}</div>
    <button class="btn b-gray dbench" data-act="bopen">🧪 Ouvrir la paillasse · ${D.played.length} manip${D.played.length>1?'s':''}</button>`; }
let benchSel=null;
function openBench(i){ const N=run.n; i=i==null?N.focus:i; const D=N.ds[i]; if(!D) return; benchSel=D.played.length?D.played.length-1:null; let el=$('#benchv'); if(!el){ el=document.createElement('div'); el.id='benchv'; document.body.appendChild(el); } el.dataset.i=i; el.classList.add('first'); setTimeout(()=>el.classList.remove('first'),900); drawBench(); sfx('sel'); }
function drawBench(){ const el=$('#benchv'); if(!el) return; const N=run.n, D=N.ds[+el.dataset.i], b=BACT[D.bid], h=helpLv(), E=candOf(D);
  const items=D.played.map((p,j)=>{ let t; try{ t=p.ill?['TROP TÔT','#FF4D6D']:shortTag(p.id,b,p.res); }catch(e){}
    return `<button class="bitem ${benchSel===j?'on':''} ${p.ill?'ill':''}" data-act="bsel" data-j="${j}" style="animation-delay:${j*.06}s"><span class="bi-svg">${p.res.svg||''}</span><span class="bi-shadow"></span><span class="bi-lab"><b>${String(j+1).padStart(2,'0')}</b> ${tileCap(p.id,b)}</span>${t&&t[0]?`<span class="bi-tag" style="--tc:${t[1]}">➜ ${t[0]}</span>`:''}</button>`; }).join('');
  const p=benchSel!=null?D.played[benchSel]:null, it=p&&h>=1?interp(p.id,b,p.res):'';
  el.innerHTML=`<div class="bv-top"><div class="dp-ava">${patAvatar(D.pat)}</div><div class="bv-id"><b>${D.pat.nm}</b><small>${PRE[D.pr]} ${PRN[D.pr]}${h>=1&&D.played.length?` · 🔎 ${E.cand.length} piste${E.cand.length>1?'s':''}`:''}</small></div><button class="btn b-gray" data-act="bclose">✕</button></div>
    <div class="bv-scene"><div class="bv-wall"><div class="bv-shelf"></div><div class="bv-sign">PAILLASSE · ${PRN[D.pr].toUpperCase()}</div></div>
      <div class="bv-top2">${items||'<div class="bv-empty">Paillasse vide : lance une manip sur ce tube.</div>'}</div><div class="bv-edge"></div></div>
    ${p?`<div class="bv-info"><small>${String(benchSel+1).padStart(2,'0')} · ${tileCap(p.id,b)}${p.ill?' · ⚠ joué trop tôt':''}</small><b>${fmtNums(p.res.d)}</b>${it?`<i>👉 ${it}</i>`:''}${h>=2&&E.elim[benchSel]>0?`<em>écarte ${E.elim[benchSel]} piste${E.elim[benchSel]>1?'s':''}</em>`:''}</div>`:''}
    <div class="row" style="gap:8px;margin-top:8px"><button class="btn b-gray grow" data-act="bclose">↩ Retour au portoir</button>${D.done?'':`<button class="btn b-orange grow" data-act="bdossier" ${D.played.length?'':'disabled'}>📋 Rendre</button>`}</div>`; }
ACT.bopen=()=>openBench(); ACT.bsel=d=>{ benchSel=+d.j; sfx('sel'); drawBench(); };
ACT.bclose=()=>{ const e=$('#benchv'); if(e){ e.classList.add('out'); setTimeout(()=>e.remove(),200); } };
ACT.bdossier=()=>{ ACT.bclose(); ACT.dossier(); };
{ const _f=ACT.focus; ACT.focus=d=>{ const N=run.n; if(!N.sel&&+d.i===N.focus&&N.ds[+d.i]&&N.ds[+d.i].arrive<=N.clock){ openBench(+d.i); return; } return _f(d); }; }

/* ===================== v12 · magasin : deux familles bien séparées ===================== */
function genGearShop(){ const caps=[], sps=[]; Object.keys(GEAR).forEach(k=>{ if(!gearTools(k).length) return; if((run.gear[k]||0)<GEAR[k].max) caps.push(k); if(gearTools(k).some(id=>CARDS[id].c*60-30*spdLv(k)>30)) sps.push('sp:'+k); });
  const a=shuffle(caps), s=shuffle(sps); let out=[...a.slice(0,2),...s.slice(0,1)]; if(out.length<3) out=[...out,...a.slice(2),...s.slice(1)].slice(0,3); return out; }
{ const _rg=renderGearShop; renderGearShop=function(){ _rg(); try{ const shelf=document.querySelector('.gshelf'); if(!shelf) return; const its=[...shelf.children]; const cap=its.filter(e=>!e.classList.contains('sp')), sp=its.filter(e=>e.classList.contains('sp'));
  shelf.outerHTML=`${cap.length?`<div class="gsec cap"><div class="gsec-h">➕ Faire plus de tubes à la fois</div><div class="gshelf">${cap.map(e=>e.outerHTML).join('')}</div></div>`:''}${sp.length?`<div class="gsec spd"><div class="gsec-h">⏱ Aller plus vite</div><div class="gshelf">${sp.map(e=>e.outerHTML).join('')}</div></div>`:''}`; }catch(e){} }; }
/* ===================== v13 · catégories d'outils ===================== */
const TCATS=[['exam','🔍 Examens directs',['exam','tube','qcrach','clin']],['micro','🔬 Microscopie',['micro']],['milieu','🧫 Cultures',['milieu']],['test','🧪 Tests',['test','drop']],['ident','🧾 Identification',['ident','spe']],['dos','📟 Dosages & automates',['dos','auto','u']]];
function toolsGrouped(tools,mk){ const used=new Set(); let h='';
  TCATS.forEach(([k,n,ts])=>{ const L=tools.filter(id=>ts.includes(CARDS[id].t)); if(!L.length) return; L.forEach(x=>used.add(x)); h+=`<div class="ncat">${n}<small>${L.length}</small></div>${L.map(mk).join('')}`; });
  const rest=tools.filter(x=>!used.has(x)); if(rest.length) h+=`<div class="ncat">✨ Autres</div>${rest.map(mk).join('')}`; return h; }
/* ===================== v13 · horloge sans « h » ===================== */
durShort=m=>{ if(m<=0) return '0'; const h=Math.floor(m/60), r=m%60; return (h||'')+(r>=30?'½':''); };
/* ===================== v13 · missions plus cohérentes ===================== */
const vals=b=>Object.entries(b.v||{}).map(([id,v])=>[id,typeof v==='string'?v:v.d]).filter(([id,v])=>v&&v!==NORM[id]);
{ const G=QGEN;
  const _gel=G.gelose; G.gelose=function(){ for(let n=0;n<10;n++){ const q=_gel(); if(!q) return null; if(!q.visual) return q;
      /* ne garder que les propositions qui ont un visuel différent : sinon on ne peut pas répondre en regardant */
      const tools=posteTools(run.mode); let svgOf={};
      for(const k of qCases()){ for(const id of tools){ const C=CARDS[id]; if(!(C.media||['gram','frottis','etat','cos'].includes(id))||!C.pr.includes(BACT[k].pr)) continue; try{ const r=result(id,BACT[k],{pr:BACT[k].pr,bid:k,flags:{exam:1,gram:1,culture:1,catok:1,oxok:1},contamDone:true,played:[]}); if(r&&r.d&&!r.nf) svgOf[r.d]=r.svg; }catch(e){} } }
      const good=q.options.find(o=>o.ok); const opts=q.options.filter(o=>o.ok||(svgOf[o.t]&&svgOf[o.t]!==q.visual));
      if(opts.length>=3){ q.options=opts; return q; } } return null; };
  G.conduite=function(){ const ks=qCases(b=>b.cc&&b.pr!=='ih'); if(!ks.length) return null; const k=rand(ks), b=BACT[k], set=CATSETS[DISC(b.pr)]; let prompt;
    if(DISC(b.pr)==='bact') prompt=`${PRE[b.pr]} ${b.ras?'Résultat : <b>'+b.n+'</b>':'Bactérie identifiée : <b>'+b.n+'</b>'}. Quelle conduite à tenir ?`;
    else { const v=vals(b).slice(0,3); prompt=`${PRE[b.pr]} ${b.ctx[0]}<br>${v.length?v.map(([id,x])=>`<b>${CARDS[id]?CARDS[id].n+' : ':''}${x}</b>`).join('<br>'):'<b>Tous les résultats sont normaux</b>'}<br>Que fais-tu ?`; }
    return {kind:'choice',icon:'💊',title:'Conduite à tenir',prompt,options:qShuf([{t:CATS[b.cc],ok:1},...qPick(3,set.filter(c=>c!==b.cc)).map(c=>({t:CATS[c]}))]),expl:`${CATS[b.cc]} : ${b.atb}. ${CATEXPL[b.cc]||''}`}; };
  const _vf=G.vraifaux; G.vraifaux=function(){ if(run.mode==='micro') return _vf();
    const ks=qCases(b=>(b.cc==='CRIT'||b.cc==='VAL')&&b.pr!=='ih'&&vals(b).length); if(ks.length<3) return null;
    const st=qPick(3,ks).map(k=>{ const b=BACT[k], v=vals(b)[0]; return {t:`${b.ctx[0]} · « ${v[1]} » : c'est une valeur critique, il faut appeler le médecin tout de suite.`,v:b.cc==='CRIT'}; });
    return {kind:'tf',icon:'⚡',title:'Valeur critique ?',prompt:'Pour chaque résultat : faut-il appeler le médecin tout de suite ?',st,expl:st.map(x=>`${x.v?'✅ Oui, valeur critique':'❌ Non, on valide et on transmet'} : ${x.t.split(' : c\'est')[0]}`).join('<br>')}; }; }
